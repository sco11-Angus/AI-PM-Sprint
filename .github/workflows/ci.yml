# ============================================================
# CI: Continuous Integration — Build & Test
# ============================================================
# Triggers on every push and pull request to main.
# Runs backend tests and frontend build/lint in parallel.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Job 1: Backend — Python install, smoke tests
  # ----------------------------------------------------------
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend smoke tests
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from main import app

          client = TestClient(app)

          # Health check
          r = client.get('/api/health')
          assert r.status_code == 200, f'health check failed: {r.status_code}'
          assert r.json()['status'] == 'ok', 'database not connected'
          print('[PASS] /api/health')

          # Task list — should have 30 days
          r = client.get('/api/tasks')
          assert r.status_code == 200
          assert len(r.json()['tasks']) == 30, 'expected 30 tasks'
          print('[PASS] /api/tasks returns 30 tasks')

          # Single day task
          r = client.get('/api/tasks/7')
          assert r.status_code == 200
          assert r.json()['day'] == 7
          print('[PASS] /api/tasks/7')

          # Day out of range → 404
          r = client.get('/api/tasks/99')
          assert r.status_code == 404
          print('[PASS] /api/tasks/99 → 404')

          # Daily content
          r = client.get('/api/daily/7')
          assert r.status_code == 200
          assert r.json()['day'] == 7
          print('[PASS] /api/daily/7')

          # Frontier insight
          r = client.get('/api/frontier/7')
          assert r.status_code == 200
          print('[PASS] /api/frontier/7')

          # Progress summary
          r = client.get('/api/progress')
          assert r.status_code == 200
          data = r.json()
          assert data['totalDays'] == 30
          print('[PASS] /api/progress')

          # Update progress
          r = client.put('/api/progress/7', json={'status': 'completed'})
          assert r.status_code == 200
          assert r.json()['status'] == 'completed'
          print('[PASS] PUT /api/progress/7')

          # Invalid status → 422
          r = client.put('/api/progress/7', json={'status': 'invalid'})
          assert r.status_code == 422
          print('[PASS] PUT /api/progress/7 invalid → 422')

          # Model config
          r = client.get('/api/model-config')
          assert r.status_code == 200
          assert 'provider' in r.json()
          print('[PASS] /api/model-config')

          print()
          print('========================================')
          print('  All backend smoke tests passed! ✓')
          print('========================================')
          "

  # ----------------------------------------------------------
  # Job 2: Frontend — Node install, lint, build
  # ----------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 7

  # ----------------------------------------------------------
  # Job 3: Full integration verify (depends on 1 + 2)
  # ----------------------------------------------------------
  integration:
    name: Integration Verify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run full verify script
        run: chmod +x scripts/verify.sh && bash scripts/verify.sh

      - name: Summary
        run: |
          echo "========================================"
          echo "  CI Pipeline Complete ✓"
          echo "  - Backend: smoke tests passed"
          echo "  - Frontend: lint + build passed"
          echo "  - Integration: verify script passed"
          echo "========================================"
