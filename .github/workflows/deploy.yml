# ============================================================
# CD: Continuous Deployment — Vercel + Render
# ============================================================
# Triggers automatically after CI passes on push to main.
# - Frontend → Vercel (Next.js native)
# - Backend  → Render (Python ASGI via deploy hook)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — Vercel personal access token
#   VERCEL_ORG_ID       — Vercel team/org ID
#   VERCEL_PROJECT_ID   — Vercel project ID
#   RENDER_DEPLOY_HOOK  — Render deploy hook URL for backend
#
# If secrets are missing, the corresponding deploy step is skipped
# with a warning — CI still passes.
# ============================================================

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Only one deployment at a time per branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # Deploy Frontend to Vercel
  # ----------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Check Vercel secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || \
             [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || \
             [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::Vercel secrets not configured. Skipping frontend deployment."
            echo "::warning::Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in repo secrets."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel environment (production)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (Vercel)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        working-directory: frontend
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "::notice::Frontend deployed to $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ----------------------------------------------------------
  # Deploy Backend to Render (via deploy hook)
  # ----------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Render secret
        id: check_render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "::warning::RENDER_DEPLOY_HOOK not configured. Skipping backend deployment."
            echo "::warning::Create a Render web service and add its deploy hook URL to repo secrets."
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Render deploy
        if: steps.check_render.outputs.has_secret == 'true'
        run: |
          echo "Triggering Render deploy hook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "::notice::Render deploy triggered successfully (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
          else
            echo "::error::Render deploy hook failed (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi

  # ----------------------------------------------------------
  # Summary job
  # ----------------------------------------------------------
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "========================================"
          echo "  Deployment Pipeline Summary"
          echo "========================================"
          echo "  Frontend (Vercel): ${{ needs.deploy-frontend.result }}"
          echo "  Backend (Render):  ${{ needs.deploy-backend.result }}"
          echo "========================================"
          if [ "${{ needs.deploy-frontend.result }}" = "skipped" ] || \
             [ "${{ needs.deploy-backend.result }}" = "skipped" ]; then
            echo "::warning::Some deployments were skipped. Configure the required secrets:"
            echo "::warning::  Frontend: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            echo "::warning::  Backend:  RENDER_DEPLOY_HOOK"
          fi
